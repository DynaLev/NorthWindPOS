# Odoo 20 Community para NorthWindPOS.
# Postgres no se publica al host: el puerto 5432 de esta máquina ya está ocupado.
# Odoo se publica en 127.0.0.1:8070 y, si Tailscale está encendido, en la IP indicada abajo.
name: northwind-odoo20

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - northwind-odoo20-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 8069 ya lo usa otra instalación. 8070 queda en localhost y en la IP de Tailscale.
      - "127.0.0.1:8070:8069"
      - "100.112.190.88:8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - northwind-odoo20-data:/var/lib/odoo
    # La base odoo20_northwind ya se inicializó con point_of_sale.
    # Si se borran los volúmenes, volver a añadir: -i point_of_sale
    command: ["--", "-d", "odoo20_northwind"]

volumes:
  northwind-odoo20-db:
  northwind-odoo20-data:
